name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    name: pnpm, MySQL, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      MYSQL_TEST_ADMIN_URL: mysql://root@127.0.0.1:3306/mysql

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Playwright
        run: pnpm --filter ./frontend exec playwright install --with-deps chrome

      - name: Check repository layout
        run: pnpm test:layout

      - name: Run root test gate
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Run financial council with real MySQL
        run: pnpm test:financial-council

      - name: Run Chromium regression suites
        run: pnpm --filter ./frontend test:e2e

      - name: Run real council browser acceptance
        run: pnpm test:e2e:financial-council:real

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
