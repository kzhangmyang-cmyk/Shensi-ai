      type: object
      additionalProperties: false
      required: [phase, currentKeyword, browserMode, sequence]
      properties:
        phase: { type: string, enum: [queued, starting_browser, opening_douyin, searching, collecting_comments, finalizing, completed] }
        currentKeyword: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        browserMode: { type: string, enum: [visible, headless] }
        sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
    DesktopDouyinNormalizedRecord:
      type: object
      additionalProperties: false
      required: [recordId, kind, actorKind, canonicalUrl, publicDisplayName, publicProfileUrl, textExcerpt, sourceKeyword, observedAt, contentHash]
      properties:
        recordId: { type: string, minLength: 1, maxLength: 255 }
        kind: { type: string, enum: [video, creator, comment] }
        actorKind: { type: [string, 'null'], enum: [creator, commenter, null] }
        canonicalUrl: { type: string, format: uri, maxLength: 2000, pattern: '^https://www\.douyin\.com/' }
        publicDisplayName: { type: string, maxLength: 200 }
        publicProfileUrl: { type: [string, 'null'], format: uri, maxLength: 2000, pattern: '^https://www\.douyin\.com/user/[A-Za-z0-9_-]{1,300}$' }
        textExcerpt: { type: string, maxLength: 500 }
        sourceKeyword: { type: string, maxLength: 100 }
        observedAt: { type: string, format: date-time }
        contentHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      allOf:
        - if: { properties: { kind: { const: video } }, required: [kind] }
          then: { properties: { actorKind: { type: 'null' } } }
        - if: { properties: { kind: { const: creator } }, required: [kind] }
          then: { properties: { actorKind: { const: creator }, publicProfileUrl: { type: string } } }
        - if: { properties: { kind: { const: comment } }, required: [kind] }
          then: { properties: { actorKind: { const: commenter }, publicProfileUrl: { type: string } } }
    DesktopCrawlerTerminal:
      type: object
      additionalProperties: false
      required: [state, failureCode, activity]
      properties:
        state: { type: string, enum: [succeeded, partial] }
        failureCode: { type: [string, 'null'], enum: [crawl_interrupted_after_partial_results, null] }
        activity:
          allOf:
            - { $ref: '#/components/schemas/DesktopCrawlerActivity' }
            - type: object
              properties:
                phase: { const: completed }
                currentKeyword: { type: 'null' }
                browserMode: { const: visible }
      oneOf:
        - properties: { state: { const: succeeded }, failureCode: { type: 'null' } }
        - properties: { state: { const: partial }, failureCode: { const: crawl_interrupted_after_partial_results } }
    DesktopCrawlerPageInput:
      type: object
      additionalProperties: false
      required: [leaseVersion, cursor, nextCursor, done, records]
      properties:
        leaseVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        cursor: { type: [string, 'null'], maxLength: 512 }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
        done: { type: boolean }
        records: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DesktopDouyinNormalizedRecord' } }
        terminal: { $ref: '#/components/schemas/DesktopCrawlerTerminal' }
