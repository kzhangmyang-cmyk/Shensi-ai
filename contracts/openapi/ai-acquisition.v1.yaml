      properties:
        run: { $ref: '#/components/schemas/DouyinAutomationRunIntent' }
        taskToken:
          type: string
          minLength: 32
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
          description: Opaque one-job capability. Keep only in memory and send only in X-Shensi-Desktop-Task-Token.
