openapi: 3.1.0
info:
  title: AI Acquisition API
  version: ai-acquisition.v1
  description: Versioned contract for authenticated AI acquisition operations.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: gj_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    candidateId:
      name: candidateId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    planIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 租户作用域内的写入幂等键；原文不会持久化。
      schema: { type: string, minLength: 8, maxLength: 200 }
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    acquisitionId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    acquisitionCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 8192 }
    acquisitionLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    candidateIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"candidate-v[1-9]\d*"$' }
    presentationAfter:
      name: after
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 8192 }
    presentationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    AsyncOperation: { $ref: ../json-schema/async-operation.v1.schema.json }
    ApiError:
      oneOf:
        - type: object
          additionalProperties: false
          required: [code, message, details, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
            retryable: { type: boolean }
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
                details: {}
                requestId: { type: string }
    PagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
    ModelProvider: { $ref: ../json-schema/model-provider.v1.schema.json }
    ModelConnection: { $ref: ../json-schema/model-connection.v1.schema.json }
    ModelCallRecord: { $ref: ../json-schema/model-call-record.v1.schema.json }
    DiscoveryProvider: { $ref: ../json-schema/discovery-provider.v1.schema.json }
    ProviderConnection: { $ref: ../json-schema/provider-connection.v1.schema.json }
    ContentFetchOperation: { $ref: ../json-schema/content-fetch-operation.v1.schema.json }
    ContentFetchOperationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentFetchOperation' }
    ImportOperation: { $ref: ../json-schema/import-operation.v1.schema.json }
    ImportOperationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImportOperation' }
    CandidateIntelligenceOperation: { $ref: ../json-schema/candidate-intelligence-operation.v1.schema.json }
    DouyinIdentityResolutionOperation: { $ref: ../json-schema/douyin-identity-resolution-operation.v1.schema.json }
    AcquisitionPlan: { $ref: ../json-schema/acquisition-plan.v1.schema.json }
    AcquisitionRun: { $ref: ../json-schema/acquisition-run.v1.schema.json }
    AcquisitionOperationShard: { $ref: ../json-schema/acquisition-operation-shard.v1.schema.json }
    AcquisitionRunPresentation: { $ref: ../json-schema/acquisition-run-presentation.v1.schema.json }
    OrganizationCandidate: { $ref: ../json-schema/organization-candidate.v1.schema.json }
    IndividualDemandSignal: { $ref: ../json-schema/individual-demand-signal.v1.schema.json }
    Candidate:
      oneOf:
        - { $ref: '#/components/schemas/OrganizationCandidate' }
        - { $ref: '#/components/schemas/IndividualDemandSignal' }
    CandidatePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        nextCursor: { type: [string, 'null'] }
    DiscoveryEvidence: { $ref: ../json-schema/discovery-evidence.v1.schema.json }
    QualificationDecision: { $ref: ../json-schema/qualification-decision.v1.schema.json }
    BattleCardV1: { $ref: ../json-schema/battle-card.v1.schema.json }
    BattleCardV2: { $ref: ../json-schema/battle-card.v2.schema.json }
    BattleCard:
      oneOf:
        - { $ref: '#/components/schemas/BattleCardV1' }
        - { $ref: '#/components/schemas/BattleCardV2' }
    ReviewEvent: { $ref: ../json-schema/review-event.v1.schema.json }
    OutcomeFeedback: { $ref: ../json-schema/outcome-feedback.v1.schema.json }
    FinancialValueDecision: { $ref: ../json-schema/financial-value-decision.v1.schema.json }
    PartyRef: { $ref: ../json-schema/party-ref.v1.schema.json }
    CopilotSession: { $ref: ../json-schema/copilot-session.v1.schema.json }
    CopilotMessage: { $ref: ../json-schema/copilot-message.v1.schema.json }
    CopilotTask: { $ref: ../json-schema/copilot-task.v1.schema.json }
    DouyinAutomationPolicyInput:
      type: object
      additionalProperties: false
      required: [keywords, schedule, collectCreators, collectDemandComments, limits]
      not:
        required: [collectCreators, collectDemandComments]
        properties:
          collectCreators: { enum: [false] }
          collectDemandComments: { enum: [false] }
      properties:
        keywords: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
        schedule:
          type: object
          additionalProperties: false
          required: [enabled, localTime, timeZone]
          properties:
            enabled: { type: boolean }
            localTime: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
            timeZone: { type: string, minLength: 1, maxLength: 100 }
        dailyCandidateLimit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        collectCreators: { type: boolean }
        collectDemandComments: { type: boolean }
        limits:
          type: object
          additionalProperties: false
          required: [maxVideos, maxCommentsPerVideo, maxPagesPerVideo, maxDurationSeconds]
          properties:
            maxVideos: { type: integer, minimum: 1, maximum: 200 }
            maxCommentsPerVideo: { type: integer, minimum: 1, maximum: 200 }
            maxPagesPerVideo: { type: integer, minimum: 1, maximum: 20 }
            maxDurationSeconds: { type: integer, minimum: 60, maximum: 14400 }
    DouyinAutomationPolicyResource:
      type: object
      additionalProperties: false
      required: [id, source, workspaceId, planId, planVersionId, planVersion, planSnapshotHash, accountId, accountLoginStateVersion, version, revision, etag, policyHash, keywords, schedule, dailyCandidateLimit, collectCreators, collectDemandComments, limits, createdBy, createdAt]
      not:
        required: [collectCreators, collectDemandComments]
        properties:
          collectCreators: { enum: [false] }
          collectDemandComments: { enum: [false] }
      properties:
        id: { type: [string, 'null'] }
        source: { type: string, enum: [default, version] }
        workspaceId: { type: string }
        planId: { type: string }
        planVersionId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        planSnapshotHash: { type: string }
        accountId: { type: [string, 'null'] }
        accountLoginStateVersion: { type: [integer, 'null'], minimum: 1 }
        version: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        etag: { type: string }
        policyHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        keywords: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
        schedule:
          type: object
          additionalProperties: false
          required: [enabled, localTime, timeZone]
          properties:
            enabled: { type: boolean }
            localTime: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
            timeZone: { type: string, minLength: 1, maxLength: 100 }
        dailyCandidateLimit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        collectCreators: { type: boolean }
        collectDemandComments: { type: boolean }
        limits:
          type: object
          additionalProperties: false
          required: [maxVideos, maxCommentsPerVideo, maxPagesPerVideo, maxDurationSeconds]
          properties:
            maxVideos: { type: integer, minimum: 1, maximum: 200 }
            maxCommentsPerVideo: { type: integer, minimum: 1, maximum: 200 }
            maxPagesPerVideo: { type: integer, minimum: 1, maximum: 20 }
            maxDurationSeconds: { type: integer, minimum: 60, maximum: 14400 }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
    DouyinAutomationPolicyVersion:
      type: object
      additionalProperties: false
      required: [id, source, workspaceId, planId, planVersionId, planVersion, planSnapshotHash, accountId, accountLoginStateVersion, version, revision, etag, policyHash, keywords, schedule, dailyCandidateLimit, collectCreators, collectDemandComments, limits, createdBy, createdAt]
      not:
        required: [collectCreators, collectDemandComments]
        properties:
          collectCreators: { enum: [false] }
          collectDemandComments: { enum: [false] }
      properties:
        id: { type: string }
        source: { type: string, enum: [version] }
        workspaceId: { type: string }
        planId: { type: string }
        planVersionId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        planSnapshotHash: { type: string }
        accountId: { type: string }
        accountLoginStateVersion: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        etag: { type: string }
        policyHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        keywords: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
        schedule:
          type: object
          additionalProperties: false
          required: [enabled, localTime, timeZone]
          properties:
            enabled: { type: boolean }
            localTime: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
            timeZone: { type: string, minLength: 1, maxLength: 100 }
        dailyCandidateLimit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        collectCreators: { type: boolean }
        collectDemandComments: { type: boolean }
        limits:
          type: object
          additionalProperties: false
          required: [maxVideos, maxCommentsPerVideo, maxPagesPerVideo, maxDurationSeconds]
          properties:
            maxVideos: { type: integer, minimum: 1, maximum: 200 }
            maxCommentsPerVideo: { type: integer, minimum: 1, maximum: 200 }
            maxPagesPerVideo: { type: integer, minimum: 1, maximum: 20 }
            maxDurationSeconds: { type: integer, minimum: 60, maximum: 14400 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    DouyinAutomationRunNowInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }
    DouyinKeywordSuggestions:
      type: object
      additionalProperties: false
      required: [keywords, modelSnapshotId]
      properties:
        keywords: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
        modelSnapshotId: { type: string, minLength: 1, maxLength: 255 }
    DouyinAutomationRunIntent:
      type: object
      additionalProperties: false
      required: [id, acquisitionRunId, workspaceId, planId, planVersionId, planVersion, planSnapshotHash, policyVersionId, policyHash, accountId, accountLoginStateVersion, dailyBudgetId, localDate, trigger, collectCreators, collectDemandComments, status, reason, createdBy, createdAt]
      properties:
        id: { type: string }
        acquisitionRunId: { type: string }
        workspaceId: { type: string }
        planId: { type: string }
        planVersionId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        planSnapshotHash: { type: string }
        policyVersionId: { type: string }
        policyHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        accountId: { type: string }
        accountLoginStateVersion: { type: integer, minimum: 1 }
        dailyBudgetId: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        localDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        trigger: { type: string, enum: [run_now, scheduled] }
        collectCreators: { type: boolean }
        collectDemandComments: { type: boolean }
        status: { type: string, enum: [queued] }
        reason: { type: [string, 'null'], maxLength: 2000 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    AcquisitionCrawlerStatus:
      type: object
      additionalProperties: false
      required: [runId, state, attempt, cursorPersisted, recordCount, candidateBudgetUsed, candidateBudgetLimit, lastErrorCode, createdAt, updatedAt, completedAt]
      properties:
        runId: { type: string }
        state: { type: string, enum: [scheduled, queued, running, succeeded, partial, paused, cancelled, failed] }
        attempt: { type: integer, minimum: 0 }
        cursorPersisted: { type: boolean }
        recordCount: { type: integer, minimum: 0 }
        candidateBudgetUsed: { type: integer, minimum: 0 }
        candidateBudgetLimit: { type: integer, minimum: 1, maximum: 200 }
        lastErrorCode: { type: [string, 'null'], maxLength: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    AcquisitionRunCandidate:
      type: object
      additionalProperties: false
      required: [id, status, displayName, evidence]
      properties:
        id: { type: string }
        status: { type: string }
        displayName: { type: string, maxLength: 200 }
        evidence:
          type: object
          additionalProperties: false
          required: [sourceUrl, excerpt]
          properties:
            sourceUrl: { type: string, format: uri }
            excerpt: { type: string, maxLength: 500 }
    AcquisitionOutreachBatchCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, selected, candidateRevision, evidenceHashes, draftRevision, comment, commentHash, directMessage, directMessageHash, rationaleCodes, modelSnapshotId, sourceModelSnapshotId, contentHash]
      properties:
        candidateId: { type: string, minLength: 1, maxLength: 255 }
        selected: { type: boolean }
        candidateRevision: { type: integer, minimum: 1 }
        evidenceHashes: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, pattern: '^sha256:[a-f0-9]{64}$' } }
        draftRevision: { type: integer, minimum: 1 }
        comment: { type: string, minLength: 1, maxLength: 300 }
        commentHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        directMessage: { type: string, minLength: 1, maxLength: 800 }
        directMessageHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        rationaleCodes: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { type: string, enum: [evidence_grounded, public_need_signal, manual_review_required] } }
        modelSnapshotId: { type: string, minLength: 1, maxLength: 255 }
        sourceModelSnapshotId: { type: string, minLength: 1, maxLength: 255 }
        contentHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    AcquisitionOutreachBatch:
      type: object
      additionalProperties: false
      required: [id, workspaceId, runId, planId, planVersionId, planVersion, planSnapshotHash, policyVersionId, policyHash, accountId, accountLoginStateVersion, dailyBudgetId, localDate, dailyCandidateLimit, dailyRemainingLimit, revision, etag, state, candidates, batchHash, approvedBy, approvedAt, approvalHash, rejectedBy, rejectedAt, rejectionReason, pauseReason, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        workspaceId: { type: string, minLength: 1, maxLength: 255 }
        runId: { type: string, minLength: 1, maxLength: 160 }
        planId: { type: string, minLength: 1, maxLength: 160 }
        planVersionId: { type: string, minLength: 1, maxLength: 160 }
        planVersion: { type: integer, minimum: 1 }
        planSnapshotHash: { type: string, minLength: 1, maxLength: 200 }
        policyVersionId: { type: string, minLength: 1, maxLength: 255 }
        policyHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        accountId: { type: string, minLength: 1, maxLength: 255 }
        accountLoginStateVersion: { type: integer, minimum: 1 }
        dailyBudgetId: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        localDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        dailyCandidateLimit: { type: integer, minimum: 1, maximum: 200 }
        dailyRemainingLimit: { type: integer, minimum: 0, maximum: 200 }
        revision: { type: integer, minimum: 1 }
        etag: { type: string, minLength: 1, maxLength: 255 }
        state: { type: string, enum: [awaiting_approval, approved, rejected, paused] }
        candidates: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/AcquisitionOutreachBatchCandidate' } }
        batchHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        approvedBy: { type: [string, 'null'], maxLength: 255 }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvalHash: { type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$' }
        rejectedBy: { type: [string, 'null'], maxLength: 255 }
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'], maxLength: 2000 }
        pauseReason: { type: [string, 'null'], maxLength: 2000 }
        createdBy: { type: string, minLength: 1, maxLength: 255 }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, minLength: 1, maxLength: 255 }
        updatedAt: { type: string, format: date-time }
    AcquisitionOutreachAction:
      type: object
      additionalProperties: false
      required: [id, workspaceId, batchId, batchRevision, candidateId, accountId, accountLoginStateVersion, policyVersionId, localDate, kind, sequence, status, predecessorActionId, targetPublicUrl, content, contentHash, approvalHash, createdAt, attemptCount, platformReceiptReference, occurredAt, failureCode]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        workspaceId: { type: string, minLength: 1, maxLength: 255 }
        batchId: { type: string, minLength: 1, maxLength: 255 }
        batchRevision: { type: integer, minimum: 1 }
        candidateId: { type: string, minLength: 1, maxLength: 255 }
        accountId: { type: string, minLength: 1, maxLength: 255 }
        accountLoginStateVersion: { type: integer, minimum: 1 }
        policyVersionId: { type: string, minLength: 1, maxLength: 255 }
        localDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        kind: { type: string, enum: [comment, direct_message] }
        sequence: { type: integer, enum: [1, 2] }
        status: { type: string, enum: [queued, blocked_by_predecessor, executing, succeeded, failed, risk_paused] }
        predecessorActionId: { type: [string, 'null'], maxLength: 255 }
        targetPublicUrl: { type: string, format: uri, maxLength: 2000 }
        content: { type: string, minLength: 1, maxLength: 800 }
        contentHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        approvalHash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
        attemptCount: { type: integer, minimum: 0 }
        platformReceiptReference: { type: [string, 'null'], minLength: 1, maxLength: 255 }
        occurredAt: { type: [string, 'null'], format: date-time }
        failureCode:
          type: [string, 'null']
          enum: [action_unavailable, action_rejected, deadline_exceeded, douyin_verification_required, douyin_rate_limited, douyin_account_warning, douyin_login_expired, douyin_action_control_missing, douyin_action_timeout, null]
    AcquisitionOutreachActionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AcquisitionOutreachAction' } }
    DouyinAutomationFailureCode:
      type: string
      enum: [unauthorized, workspace_required, workspace_context_invalid, invalid_request, invalid_automation_scope, invalid_automation_policy, invalid_automation_keywords, invalid_automation_schedule, invalid_automation_local_time, invalid_automation_time_zone, invalid_automation_collection, automation_collection_required, invalid_automation_limits, invalid_daily_candidate_limit, invalid_run_now_input, invalid_idempotency_key, invalid_if_match, if_match_required, automation_plan_not_found, automation_plan_snapshot_corrupt, active_douyin_account_required, active_douyin_account_workspace_mismatch, automation_policy_required, approved_automation_plan_required, automation_policy_plan_version_mismatch, automation_account_login_state_changed, automation_idempotency_conflict, automation_precondition_failed, automation_policy_binding_conflict, automation_run_binding_conflict, automation_policy_binding_corrupt, automation_idempotency_record_corrupt, automation_internal_error]
    PlatformConnection: { $ref: ../json-schema/platform-connection.v1.schema.json }
    PlatformCapabilitySnapshot: { $ref: ../json-schema/platform-capability-snapshot.v1.schema.json }
    PlatformEvent: { $ref: ../json-schema/platform-event.v1.schema.json }
    DouyinCommentEvent: { $ref: ../json-schema/douyin-comment-event.v1.schema.json }
    ActionPolicy: { $ref: ../json-schema/action-policy.v1.schema.json }
    ActionReceipt: { $ref: ../json-schema/action-receipt.v1.schema.json }
    DouyinVisualCommentObservation: { $ref: '../json-schema/douyin-visual-comment-observation.v1.schema.json#/$defs/douyinVisualCommentObservation' }
    OpaqueRectRedactionProof: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderOpaqueRectRedactionProof' }
    VisualObservationSubmission: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationSubmission' }
    VisualReaderLimits: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderLimits' }
    VisualReaderUsage: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderUsage' }
    VisualReaderOutcome: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderOutcome' }
    VisualReaderSession: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderSession' }
    VisualReaderCreateRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderCreateRequest' }
    VisualObservationBatchRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationBatchRequest' }
    VisualObservationBatchResponse: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationBatchResponse' }
    VisualReaderCompleteRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderCompleteRequest' }
    VisualReaderAbortRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderAbortRequest' }
    DiscoveryEvidencePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DiscoveryEvidence' } }
        nextCursor: { type: [string, 'null'] }
    ReviewEventPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewEvent' } }
        nextCursor: { type: [string, 'null'] }
    OutcomeFeedbackPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
