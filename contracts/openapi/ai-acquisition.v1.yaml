      type: array
      maxItems: 500
      items:
        type: object
        required: [operationId, subjectChannel, kind, connectionId, allocatedBudget]
        properties:
          operationId: { type: string, minLength: 1, maxLength: 255 }
          subjectChannel: { type: string, enum: [organization, individual] }
          kind: { type: string, enum: [search, content_fetch, import_rows] }
          connectionId: { type: string, minLength: 1, maxLength: 255 }
          query: { type: string, minLength: 1, maxLength: 4000 }
          sourceRef: { type: string, minLength: 1, maxLength: 4000 }
          allocatedBudget:
            type: object
            required: [requests, results, amountMinor, durationSeconds]
            properties:
              requests: { type: integer, minimum: 0 }
              results: { type: integer, minimum: 0 }
              amountMinor: { type: integer, minimum: 0 }
              durationSeconds: { type: integer, minimum: 0 }
            additionalProperties: false
        additionalProperties: false
    budgetSnapshot:
      type: object
      required: [billingCurrency, maxRequests, maxResults, maxAmountMinor, maxDurationSeconds]
      properties:
        billingCurrency: { type: string, minLength: 3, maxLength: 3 }
        maxRequests: { type: integer, minimum: 0 }
        maxResults: { type: integer, minimum: 0 }
        maxAmountMinor: { type: integer, minimum: 0 }
        maxDurationSeconds: { type: integer, minimum: 0 }
      additionalProperties: false
    modelConnectionId:
      type: string
      nullable: true
      minLength: 1
      maxLength: 255
      description: >-
        Optional BYOK model connection for generic plans. It must be omitted or
        null for douyin_mediacrawler plans.
    stopConditions:
      type: object
      required: [stopWhenBudgetExhausted, stopWhenNoMoreResults]
      properties:
        stopWhenBudgetExhausted: { type: boolean }
        stopWhenNoMoreResults: { type: boolean }
      additionalProperties: false
  allOf:
    - if:
        type: object
        required: [executionMode]
        properties:
          executionMode: { enum: [douyin_mediacrawler] }
      then:
        type: object
        required: [targetPlatform, providerConnections, operations]
        properties:
          targetPlatform: { enum: [douyin] }
          providerConnections: { type: array, maxItems: 0 }
          operations: { type: array, maxItems: 0 }
          modelConnectionId: { type: string, enum: [null], nullable: true }
      else:
        type: object
        properties:
          providerConnections: { type: array, minItems: 1 }
          operations: { type: array, minItems: 1 }
    - if:
        type: object
        required: [douyinPublicCommentSample]
        properties:
          douyinPublicCommentSample:
            type: object
            required: [enabled]
            properties:
              enabled: { enum: [true] }
      then:
        type: object
        required: [targetPlatform, providerConnections]
        properties:
          targetPlatform: { enum: [douyin] }
          providerConnections:
            type: array
            not:
              items:
                not:
                  type: object
                  required: [providerId, kind, status]
                  properties:
                    providerId: { enum: [experimental_public_sample] }
                    kind: { enum: [content_fetch] }
                    status: { enum: [active] }
  additionalProperties: false
