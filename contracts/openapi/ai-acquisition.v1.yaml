paths:
  /api/v1/ai/providers:
    get: { <<: *list, summary: List model providers }
  /api/v1/ai/connections:
    get: { <<: *list, summary: List model connections }
    post: { <<: *write, summary: Create model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
  /api/v1/ai/connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
    delete: { <<: *write, summary: Delete model connection, responses: { '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }, '400': *apiError, '401': *apiError, '409': { description: Connection is retained by active tasks or audit policy, headers: { X-Error-Code: { required: true, schema: { type: string, enum: [connection_in_use] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } } } }
  /api/v1/ai/connections/{id}/models:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List supported models }
  /api/v1/ai/connections/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Test model connection }
  /api/v1/ai/connections/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Activate model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
  /api/v1/ai/calls:
    get: { <<: *list, summary: List model call records }
  /api/v1/ai/calls/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model call record, responses: { '200': { description: Model call record, content: { application/json: { schema: { $ref: '#/components/schemas/ModelCallRecord' } } } }, '401': *apiError } }
  /api/v1/acquisition/providers:
    get:
      operationId: listAcquisitionProviders
      summary: List discovery providers
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Discovery provider catalog, content: { application/json: { schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: *discoveryProviderSchema }, nextCursor: { type: string, nullable: true } }, additionalProperties: false } } } }
  /api/v1/acquisition/provider-connections:
    get:
      operationId: listAcquisitionProviderConnections
      summary: List provider connections
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Provider connections, content: { application/json: { schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: *providerConnectionSchema }, nextCursor: { type: string, nullable: true } }, additionalProperties: false } } } }
    post:
      operationId: createAcquisitionProviderConnection
      summary: Create provider connection
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: *providerConnectionWriteSchema } } }
      responses:
        <<: *acquisitionStandardResponses
        '201': { description: Provider connection created, content: { application/json: { schema: *providerConnectionSchema } } }
        '200': { description: Idempotent replay, headers: { Idempotency-Replayed: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: *providerConnectionSchema } } }
  /api/v1/acquisition/provider-connections/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }]
    get:
      operationId: getAcquisitionProviderConnection
      summary: Get provider connection
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Provider connection, content: { application/json: { schema: *providerConnectionSchema } } }
    patch:
      operationId: updateAcquisitionProviderConnection
      summary: Update provider connection
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: *providerConnectionPatchSchema } } }
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Provider connection updated, content: { application/json: { schema: *providerConnectionSchema } } }
    delete:
      operationId: deleteAcquisitionProviderConnection
      summary: Delete provider connection
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      responses:
        '204': { description: Provider connection deleted }
        '400': *apiError
        '401': *apiError
        '403': *apiError
        '404': *apiError
        '500': *apiError
  /api/v1/acquisition/provider-connections/{id}/test:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }]
    post:
      operationId: testAcquisitionProviderConnection
      summary: Test provider connection
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Provider connection health check, content: { application/json: { schema: *providerConnectionHealthSchema } } }
  /api/v1/acquisition/content-fetch-operations:
    get:
      operationId: listAcquisitionContentFetchOperations
      summary: List content fetch operations
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Content fetch operations, content: { application/json: { schema: { $ref: '#/components/schemas/ContentFetchOperationList' } } } }
