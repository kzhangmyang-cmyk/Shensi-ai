      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Import operation, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperation' } } } }
