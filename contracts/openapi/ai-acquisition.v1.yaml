        maxCommentsPerVideo: { type: integer, minimum: 1, maximum: 100 }
        maxPagesPerVideo: { type: integer, minimum: 1, maximum: 5 }
      additionalProperties: false
    name: { type: string, minLength: 1, maxLength: 200 }
    objective: { type: string, minLength: 1, maxLength: 2000 }
    icp:
      type: object
      required: [industries, regions, organizationCriteria, individualCriteria, exclusionRules]
      properties:
        industries: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }
        regions: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }
