      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: *contentFetchWriteSchema } } }
      responses:
        <<: *acquisitionStandardResponses
        '202': { description: Content fetch operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ContentFetchOperation' } } } }
  /api/v1/acquisition/content-fetch-operations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }]
    get:
      operationId: getAcquisitionContentFetchOperation
      summary: Get content fetch operation
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Content fetch operation, content: { application/json: { schema: { $ref: '#/components/schemas/ContentFetchOperation' } } } }
  /api/v1/acquisition/import-operations:
    get:
      operationId: listAcquisitionImportOperations
      summary: List import operations
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        <<: *acquisitionStandardResponses
        '200': { description: Import operations, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperationList' } } } }
    post:
      operationId: createAcquisitionImportOperation
      summary: Create import operation
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
        - { name: fileName, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: subjectChannel, in: query, required: true, schema: { type: string, enum: [organization, individual] } }
        - { name: mapping, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 4096 } }
      requestBody:
        required: true
        description: Raw CSV/XLSX only; application/json returns 415 unsupported_media_type.
        content:
          text/csv: { schema: *importBinarySchema }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: *importBinarySchema }
          application/octet-stream: { schema: *importBinarySchema }
      responses:
        <<: *acquisitionStandardResponses
        '202': { description: Import operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperation' } } } }
        '413': *apiError
        '415': *apiError
  /api/v1/acquisition/import-operations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }]
    get:
      operationId: getAcquisitionImportOperation
