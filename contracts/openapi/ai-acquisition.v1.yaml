openapi: 3.1.0
info:
  title: AI Acquisition API
  version: ai-acquisition.v1
  description: Versioned contract for authenticated AI acquisition operations.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: gj_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    candidateId:
      name: candidateId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    planIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 租户作用域内的写入幂等键；原文不会持久化。
      schema: { type: string, minLength: 8, maxLength: 200 }
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    acquisitionId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    acquisitionCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 8192 }
    acquisitionLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    candidateIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"candidate-v[1-9]\d*"$' }
    presentationAfter:
      name: after
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 8192 }
    presentationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    AsyncOperation: { $ref: ../json-schema/async-operation.v1.schema.json }
    ApiError:
      oneOf:
        - type: object
          additionalProperties: false
          required: [code, message, details, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
            retryable: { type: boolean }
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
                details: {}
                requestId: { type: string }
    PagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
    ModelProvider: { $ref: ../json-schema/model-provider.v1.schema.json }
    ModelConnection: { $ref: ../json-schema/model-connection.v1.schema.json }
    ModelCallRecord: { $ref: ../json-schema/model-call-record.v1.schema.json }
    DiscoveryProvider: { $ref: ../json-schema/discovery-provider.v1.schema.json }
    ProviderConnection: { $ref: ../json-schema/provider-connection.v1.schema.json }
    ContentFetchOperation: { $ref: ../json-schema/content-fetch-operation.v1.schema.json }
    ContentFetchOperationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentFetchOperation' }
    ImportOperation: { $ref: ../json-schema/import-operation.v1.schema.json }
    ImportOperationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImportOperation' }
    CandidateIntelligenceOperation: { $ref: ../json-schema/candidate-intelligence-operation.v1.schema.json }
    DouyinIdentityResolutionOperation: { $ref: ../json-schema/douyin-identity-resolution-operation.v1.schema.json }
    AcquisitionPlan: { $ref: ../json-schema/acquisition-plan.v1.schema.json }
    AcquisitionRun: { $ref: ../json-schema/acquisition-run.v1.schema.json }
    AcquisitionOperationShard: { $ref: ../json-schema/acquisition-operation-shard.v1.schema.json }
    AcquisitionRunPresentation: { $ref: ../json-schema/acquisition-run-presentation.v1.schema.json }
    OrganizationCandidate: { $ref: ../json-schema/organization-candidate.v1.schema.json }
    IndividualDemandSignal: { $ref: ../json-schema/individual-demand-signal.v1.schema.json }
    Candidate:
      oneOf:
        - { $ref: '#/components/schemas/OrganizationCandidate' }
        - { $ref: '#/components/schemas/IndividualDemandSignal' }
    CandidatePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        nextCursor: { type: [string, 'null'] }
    DiscoveryEvidence: { $ref: ../json-schema/discovery-evidence.v1.schema.json }
    QualificationDecision: { $ref: ../json-schema/qualification-decision.v1.schema.json }
    BattleCardV1: { $ref: ../json-schema/battle-card.v1.schema.json }
    BattleCardV2: { $ref: ../json-schema/battle-card.v2.schema.json }
    BattleCard:
      oneOf:
        - { $ref: '#/components/schemas/BattleCardV1' }
        - { $ref: '#/components/schemas/BattleCardV2' }
    ReviewEvent: { $ref: ../json-schema/review-event.v1.schema.json }
    OutcomeFeedback: { $ref: ../json-schema/outcome-feedback.v1.schema.json }
    FinancialValueDecision: { $ref: ../json-schema/financial-value-decision.v1.schema.json }
    PartyRef: { $ref: ../json-schema/party-ref.v1.schema.json }
    CopilotSession: { $ref: ../json-schema/copilot-session.v1.schema.json }
    CopilotMessage: { $ref: ../json-schema/copilot-message.v1.schema.json }
    CopilotTask: { $ref: ../json-schema/copilot-task.v1.schema.json }
    PlatformConnection: { $ref: ../json-schema/platform-connection.v1.schema.json }
    PlatformCapabilitySnapshot: { $ref: ../json-schema/platform-capability-snapshot.v1.schema.json }
    PlatformEvent: { $ref: ../json-schema/platform-event.v1.schema.json }
    DouyinCommentEvent: { $ref: ../json-schema/douyin-comment-event.v1.schema.json }
    ActionPolicy: { $ref: ../json-schema/action-policy.v1.schema.json }
    ActionReceipt: { $ref: ../json-schema/action-receipt.v1.schema.json }
    DouyinVisualCommentObservation: { $ref: '../json-schema/douyin-visual-comment-observation.v1.schema.json#/$defs/douyinVisualCommentObservation' }
    OpaqueRectRedactionProof: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderOpaqueRectRedactionProof' }
    VisualObservationSubmission: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationSubmission' }
    VisualReaderLimits: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderLimits' }
    VisualReaderUsage: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderUsage' }
    VisualReaderOutcome: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderOutcome' }
    VisualReaderSession: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderSession' }
    VisualReaderCreateRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderCreateRequest' }
    VisualObservationBatchRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationBatchRequest' }
    VisualObservationBatchResponse: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderObservationBatchResponse' }
    VisualReaderCompleteRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderCompleteRequest' }
    VisualReaderAbortRequest: { $ref: '../json-schema/acquisition-visual-reader-session.v1.schema.json#/$defs/visualReaderAbortRequest' }
    DiscoveryEvidencePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DiscoveryEvidence' } }
        nextCursor: { type: [string, 'null'] }
    ReviewEventPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewEvent' } }
        nextCursor: { type: [string, 'null'] }
    OutcomeFeedbackPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutcomeFeedback' } }
        nextCursor: { type: [string, 'null'] }
    AcquisitionPerformance:
      type: object
      additionalProperties: false
      required: [counts, rates, valuesByCurrency, cost, roi, dataQuality, briefingFacts]
      properties:
        counts:
          type: object
          additionalProperties: false
          required: [discovered, highIntent, approved, converted, contacted, quoted, won, lost]
          properties:
            discovered: { type: integer, minimum: 0 }
            highIntent: { type: integer, minimum: 0 }
            approved: { type: integer, minimum: 0 }
            converted: { type: integer, minimum: 0 }
            contacted: { type: integer, minimum: 0 }
            quoted: { type: integer, minimum: 0 }
            won: { type: integer, minimum: 0 }
            lost: { type: integer, minimum: 0 }
        rates:
          type: object
          additionalProperties: false
          required: [highIntentRate, approvalRate, crmConversionRate, contactRate, quoteRate, winRate]
          properties:
            highIntentRate: { type: [number, 'null'], minimum: 0 }
            approvalRate: { type: [number, 'null'], minimum: 0 }
            crmConversionRate: { type: [number, 'null'], minimum: 0 }
            contactRate: { type: [number, 'null'], minimum: 0 }
            quoteRate: { type: [number, 'null'], minimum: 0 }
            winRate: { type: [number, 'null'], minimum: 0 }
        valuesByCurrency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, estimatedPipelineMinor, quotedMinor, wonContractMinor]
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              estimatedPipelineMinor: { type: integer, minimum: 0 }
              quotedMinor: { type: integer, minimum: 0 }
              wonContractMinor: { type: integer, minimum: 0 }
        cost:
          type: object
          additionalProperties: false
          required: [status, executionCostMinor, currency, coverage]
          properties:
            status: { type: string, enum: [available, not_aggregatable] }
            executionCostMinor: { type: [integer, 'null'], minimum: 0 }
            currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
            coverage: { type: string, enum: [recorded_api_execution_only] }
        roi:
          type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: { type: string, enum: [not_computable] }
            reason: { type: string, enum: [channel_cost_or_verified_margin_unavailable] }
        dataQuality:
          type: object
          additionalProperties: false
          required: [missingAttribution, missingFinancial, truncated, lastReconciledAt]
          properties:
            missingAttribution: { type: integer, minimum: 0 }
            missingFinancial: { type: integer, minimum: 0 }
            truncated: { type: boolean }
            lastReconciledAt: { type: [string, 'null'], format: date-time }
        briefingFacts:
          type: object
          additionalProperties: false
          required: [headlines, risks, actions, metricIds]
          properties:
            headlines: { type: array, items: { $ref: '#/components/schemas/AcquisitionPerformanceFact' } }
            risks: { type: array, items: { $ref: '#/components/schemas/AcquisitionPerformanceFact' } }
            actions: { type: array, items: { $ref: '#/components/schemas/AcquisitionPerformanceFact' } }
            metricIds: { type: array, items: { type: string } }
    AcquisitionPerformanceFact:
      type: object
      additionalProperties: false
      required: [metricId, text, evidenceRefs]
      properties:
        metricId: { type: string, minLength: 1 }
        text: { type: string }
        evidenceRefs: { type: array, items: { type: string } }
    CopilotMessagePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CopilotMessage' } }
        nextCursor: { type: [string, 'null'] }
    IdentityResolution:
      type: object
      additionalProperties: false
      required: [status, basis, resolverVersion, evidenceIds, resolvedAt, resolvedBy]
      properties:
        status: { const: resolved }
        basis: { enum: [organization_domain, organization_credit_code, provider_public_actor] }
        resolverVersion: { type: string, minLength: 1 }
        evidenceIds: { type: array, items: { type: string, minLength: 1 } }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string, minLength: 1 }
    IdentityConfirmationResult:
      type: object
      additionalProperties: false
      required: [candidate, resolution]
      properties:
        candidate: { $ref: '#/components/schemas/Candidate' }
        resolution: { $ref: '#/components/schemas/IdentityResolution' }
    ResearchAttempt:
      type: object
      additionalProperties: false
      required: [id, candidateId, requestReason, budgetVersion, status, newEvidenceIds, terminationReason, createdAt, startedAt, completedAt]
      properties:
        id: { type: string }
        candidateId: { type: string }
        requestReason: { type: string }
        budgetVersion: { type: string }
        status: { enum: [pending, running, completed, no_new_evidence, access_restricted, failed] }
        newEvidenceIds: { type: array, items: { type: string } }
        terminationReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    CandidateReviewResult:
      type: object
      additionalProperties: false
      required: [candidate, review, research]
      properties:
        candidate: { $ref: '#/components/schemas/Candidate' }
        review: { $ref: '#/components/schemas/ReviewEvent' }
        research:
          oneOf:
            - { $ref: '#/components/schemas/ResearchAttempt' }
            - { type: 'null' }
    LeadConversion:
      type: object
      additionalProperties: false
      required: [id, candidateId, decisionVersion, partyRef, leadId, reviewerId, evidenceSnapshotHash, createdAt]
      properties:
        id: { type: string }
        candidateId: { type: string }
        decisionVersion: { type: string }
        partyRef: { $ref: '#/components/schemas/PartyRef' }
        leadId: { type: string }
        reviewerId: { type: string }
        evidenceSnapshotHash: { type: string }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, candidateId, actorId, eventType, fromStatus, toStatus, resourceId, createdAt]
      properties:
        id: { type: string }
        candidateId: { type: [string, 'null'] }
        actorId: { type: string }
        eventType: { type: string }
        fromStatus: { enum: [discovered, unresolvable, normalized, qualified, pending_review, approved, rejected, do_not_contact, needs_research, converted_to_lead, null] }
        toStatus: { enum: [discovered, unresolvable, normalized, qualified, pending_review, approved, rejected, do_not_contact, needs_research, converted_to_lead, null] }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
    AuditEventPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
x-error-response: &apiError
  description: Unified API error
  content:
    application/json:
      schema: { $ref: '#/components/schemas/ApiError' }
x-paged-response: &pagedResponse
  description: Cursor-paginated result
  content:
    application/json:
      schema: { $ref: '#/components/schemas/PagedResult' }
x-async-response: &asyncResponse
  description: Accepted asynchronous operation
  content:
    application/json:
      schema: { $ref: '#/components/schemas/AsyncOperation' }
x-read: &read
  security: [{ bearerAuth: [] }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-list: &list
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-write: &write
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
    '400': *apiError
    '401': *apiError
x-async-write: &asyncWrite
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '202': *asyncResponse
    '400': *apiError
    '401': *apiError
