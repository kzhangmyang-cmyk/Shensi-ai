      maxItems: 100
      items:
        type: object
        required: [connectionId, providerId, kind, status, credentialVersion]
        properties:
          connectionId: { type: string, minLength: 1, maxLength: 255 }
          providerId: { type: string, minLength: 1, maxLength: 100 }
          kind: { type: string, enum: [search, content_fetch, import] }
          status: { type: string, enum: [active, inactive, disabled] }
          credentialVersion: { type: integer, minimum: 1 }
        additionalProperties: false
