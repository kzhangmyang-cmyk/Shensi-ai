x-error-response: &apiError
  description: Unified API error
  content:
    application/json:
      schema: { $ref: '#/components/schemas/ApiError' }
x-paged-response: &pagedResponse
  description: Cursor-paginated result
  content:
    application/json:
      schema: { $ref: '#/components/schemas/PagedResult' }
x-async-response: &asyncResponse
  description: Accepted asynchronous operation
  content:
    application/json:
      schema: { $ref: '#/components/schemas/AsyncOperation' }
x-read: &read
  security: [{ bearerAuth: [] }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-list: &list
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-write: &write
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
    '400': *apiError
    '401': *apiError
x-async-write: &asyncWrite
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '202': *asyncResponse
    '400': *apiError
    '401': *apiError
x-plan-create-schema: &planCreateSchema
  type: object
  required:
    - name
    - objective
    - icp
    - subjectChannels
    - providerConnections
    - operations
    - budgetSnapshot
    - stopConditions
  properties:
    executionMode:
      type: string
      enum: [generic, douyin_mediacrawler]
      default: generic
      description: >-
        Omit for the compatible generic provider-operation mode. Use
        douyin_mediacrawler only for private MediaCrawler discovery.
    targetPlatform: { type: string, enum: [douyin, web] }
    douyinPublicCommentSample:
      type: object
      required: [enabled, maxVideosPerRun, maxCommentsPerVideo, maxPagesPerVideo]
      properties:
        enabled: { type: boolean }
        maxVideosPerRun: { type: integer, minimum: 1, maximum: 20 }
        maxCommentsPerVideo: { type: integer, minimum: 1, maximum: 100 }
        maxPagesPerVideo: { type: integer, minimum: 1, maximum: 5 }
      additionalProperties: false
    name: { type: string, minLength: 1, maxLength: 200 }
    objective: { type: string, minLength: 1, maxLength: 2000 }
    icp:
      type: object
      required: [industries, regions, organizationCriteria, individualCriteria, exclusionRules]
      properties:
        industries: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }
        regions: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }
        organizationCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }
        individualCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }
        exclusionRules: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 500 } }
      additionalProperties: false
    subjectChannels:
      type: object
      required: [organization, individual]
      properties:
        organization: { type: boolean }
        individual: { type: boolean }
      additionalProperties: false
    providerConnections:
      type: array
      maxItems: 100
      items:
        type: object
        required: [connectionId, providerId, kind, status, credentialVersion]
        properties:
          connectionId: { type: string, minLength: 1, maxLength: 255 }
          providerId: { type: string, minLength: 1, maxLength: 100 }
          kind: { type: string, enum: [search, content_fetch, import] }
          status: { type: string, enum: [active, inactive, disabled] }
          credentialVersion: { type: integer, minimum: 1 }
        additionalProperties: false
    operations:
      type: array
      maxItems: 500
      items:
        type: object
        required: [operationId, subjectChannel, kind, connectionId, allocatedBudget]
        properties:
          operationId: { type: string, minLength: 1, maxLength: 255 }
          subjectChannel: { type: string, enum: [organization, individual] }
          kind: { type: string, enum: [search, content_fetch, import_rows] }
          connectionId: { type: string, minLength: 1, maxLength: 255 }
          query: { type: string, minLength: 1, maxLength: 4000 }
          sourceRef: { type: string, minLength: 1, maxLength: 4000 }
          allocatedBudget:
            type: object
            required: [requests, results, amountMinor, durationSeconds]
            properties:
              requests: { type: integer, minimum: 0 }
              results: { type: integer, minimum: 0 }
              amountMinor: { type: integer, minimum: 0 }
              durationSeconds: { type: integer, minimum: 0 }
            additionalProperties: false
        additionalProperties: false
    budgetSnapshot:
      type: object
      required: [billingCurrency, maxRequests, maxResults, maxAmountMinor, maxDurationSeconds]
      properties:
        billingCurrency: { type: string, minLength: 3, maxLength: 3 }
        maxRequests: { type: integer, minimum: 0 }
        maxResults: { type: integer, minimum: 0 }
        maxAmountMinor: { type: integer, minimum: 0 }
        maxDurationSeconds: { type: integer, minimum: 0 }
      additionalProperties: false
    modelConnectionId:
      type: string
      nullable: true
      minLength: 1
      maxLength: 255
