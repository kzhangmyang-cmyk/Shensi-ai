    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: askCfoSession
      description: Answer using ten saved recent turns and persist the completed pair with revision compare-and-swap. A stale revision returns 409. Interrupted requests are never automatically replayed.
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/optionalWorkspaceHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CfoSessionAsk' }
      responses:
        '200':
          description: Saved completed answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CfoSessionReply' }
            application/x-ndjson:
              schema: { type: string, description: 'Newline-delimited CfoSessionEvent objects. Exactly one terminal result or error; disconnect is incomplete, never automatically replayed.' }
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
