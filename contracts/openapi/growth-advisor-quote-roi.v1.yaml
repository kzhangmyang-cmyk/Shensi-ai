    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      <<: *write
      operationId: retryQuotePublicationOperation
      responses:
        '202': { $ref: '#/components/responses/QuotePublicationOperation' }
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
        '409': *apiErrorResponse
        '412': *apiErrorResponse
        '428': *apiErrorResponse
  /api/v1/quotes/deals/{dealId}/decision:
    parameters: [{ $ref: '#/components/parameters/dealId' }]
    post:
      <<: *write
      operationId: decideQuoteDeal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealDecisionInput' }
      responses:
        '200':
          description: Atomic Deal commercial decision, Case closure and authority revision
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [deal, event, quoteCase, authorityRevision, cancelledPublicationOperationIds]
                    properties:
                      deal:
                        type: object
                        additionalProperties: false
                        required: [id, customerId, stage, amountType, ownerId, teamId]
                        properties: &dealDecisionWonFields
                          id: { type: string, minLength: 1 }
                          customerId: { type: string, minLength: 1 }
                          stage: { const: 成交 }
                          amountType: { const: won }
                          ownerId: { type: string, minLength: 1 }
                          teamId: { type: string, minLength: 1 }
                      event:
                        type: object
                        additionalProperties: false
                        required: [id, dealId, type, commercialAuthority, quoteCaseIdSnapshot, quoteVersionIdSnapshot, commercialAmountHash, amountMinorSnapshot, currencySnapshot, reasonCode, reasonText, occurredAt, recordedAt, authorityRevision]
                        properties: &dealDecisionWonEventFields
                          id: { type: string, minLength: 1 }
                          dealId: { type: string, minLength: 1 }
                          type: { const: won }
                          commercialAuthority: { const: quote_projection }
                          quoteCaseIdSnapshot: { type: string, minLength: 1 }
                          quoteVersionIdSnapshot: { type: string, minLength: 1 }
                          commercialAmountHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                          amountMinorSnapshot: { type: integer, minimum: 1, maximum: 9007199254740991 }
                          currencySnapshot: { type: string, pattern: '^[A-Z]{3}$' }
                          reasonCode: { type: [string, 'null'] }
                          reasonText: { type: [string, 'null'] }
                          occurredAt: { type: string, format: date-time }
                          recordedAt: { type: string, format: date-time }
                          authorityRevision: { type: integer, minimum: 1 }
                      quoteCase: { $ref: '#/components/schemas/QuoteCase' }
                      authorityRevision: { type: integer, minimum: 1 }
                      cancelledPublicationOperationIds:
                        type: array
                        uniqueItems: true
                        items: { type: string, minLength: 1 }
                  - type: object
                    additionalProperties: false
                    required: [deal, event, quoteCase, authorityRevision, cancelledPublicationOperationIds]
                    properties:
                      deal:
                        type: object
                        additionalProperties: false
                        required: [id, customerId, stage, amountType, ownerId, teamId]
                        properties:
                          <<: *dealDecisionWonFields
                          stage: { const: 丢单 }
                          amountType: { const: quoted }
                      event:
                        type: object
                        additionalProperties: false
                        required: [id, dealId, type, commercialAuthority, quoteCaseIdSnapshot, quoteVersionIdSnapshot, commercialAmountHash, amountMinorSnapshot, currencySnapshot, reasonCode, reasonText, occurredAt, recordedAt, authorityRevision]
                        properties:
                          <<: *dealDecisionWonEventFields
                          type: { const: lost }
                      quoteCase: { $ref: '#/components/schemas/QuoteCase' }
                      authorityRevision: { type: integer, minimum: 1 }
                      cancelledPublicationOperationIds:
                        type: array
                        uniqueItems: true
                        items: { type: string, minLength: 1 }
                  - type: object
                    additionalProperties: false
                    required: [deal, event, quoteCase, authorityRevision, cancelledPublicationOperationIds]
                    properties:
                      deal:
                        type: object
                        additionalProperties: false
                        required: [id, customerId, stage, amountType, ownerId, teamId]
                        properties:
                          <<: *dealDecisionWonFields
                          stage: { const: 丢单 }
                          amountType: { const: estimate }
                      event:
                        type: object
                        additionalProperties: false
                        required: [id, dealId, type, commercialAuthority, quoteCaseIdSnapshot, quoteVersionIdSnapshot, commercialAmountHash, amountMinorSnapshot, currencySnapshot, reasonCode, reasonText, occurredAt, recordedAt, authorityRevision]
                        properties:
                          id: { type: string, minLength: 1 }
                          dealId: { type: string, minLength: 1 }
                          type: { const: lost }
                          commercialAuthority: { const: pre_quote_disqualified }
                          quoteCaseIdSnapshot: { type: [string, 'null'], minLength: 1 }
                          quoteVersionIdSnapshot: { type: 'null' }
                          commercialAmountHash: { type: 'null' }
                          amountMinorSnapshot: { type: 'null' }
                          currencySnapshot: { type: 'null' }
                          reasonCode: { type: string, minLength: 1 }
                          reasonText: { type: [string, 'null'] }
                          occurredAt: { type: string, format: date-time }
                          recordedAt: { type: string, format: date-time }
                          authorityRevision: { type: integer, minimum: 1 }
                      quoteCase: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/QuoteCase' }] }
                      authorityRevision: { type: integer, minimum: 1 }
                      cancelledPublicationOperationIds:
                        type: array
                        uniqueItems: true
                        items: { type: string, minLength: 1 }
        '400': *apiErrorResponse
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
        '409': *apiErrorResponse
        '412': *apiErrorResponse
        '422': *apiErrorResponse
        '428': *apiErrorResponse

