openapi: 3.1.0
info:
  title: GoodJob Growth Advisor, Quote and ROI API
  version: 1.0.41
servers:
  - url: /

x-goodjob-templates:
  read: &read
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/workspaceHeader'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sort'
    responses:
      '401': &apiErrorResponse
        description: API error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403': *apiErrorResponse
      '404': *apiErrorResponse
  write: &write
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: '#/components/parameters/workspaceHeader'
      - $ref: '#/components/parameters/idempotencyKey'
      - $ref: '#/components/parameters/ifMatch'
    requestBody: &emptyCommandBody
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
    responses:
      '400': *apiErrorResponse
      '401': *apiErrorResponse
      '403': *apiErrorResponse
      '404': *apiErrorResponse
      '409': *apiErrorResponse
      '412': *apiErrorResponse
      '422': *apiErrorResponse
      '428': *apiErrorResponse

paths:
  /api/v1/growth/bootstrap:
    get:
      operationId: getGrowthBootstrap
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/optionalWorkspaceHeader'
      responses:
        '200':
          description: Authorized concrete workspace context or actionable workspace-selection state
          content:
            application/json:
              schema:
                $ref: ../json-schema/growth-bootstrap.v1.schema.json
        '401': *apiErrorResponse

  /api/v1/catalog/items:
